<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pali FT Hatchlings Telemetry Dashboard</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

:root{
--hdr:#1a2a3a;
--blue:#1a7fe8;
--red:#e74c3c;
--orange:#e67e22;
--grey:#7f8c8d;
--border:#ddd;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Verdana}

body{
display:flex;
flex-direction:column;
height:100vh;
background:#f0f2f5;
}

/* HEADER */

header{
background:var(--hdr);
color:white;
padding:10px 16px;
display:grid;
grid-template-columns:auto 1fr auto;
align-items:center;
}

header img{
height:42px;
}

header h1{
text-align:center;
font-size:1.2rem;
}

.legend-bar{
display:flex;
gap:12px;
font-size:0.82rem;
}

.legend-item{
display:flex;
align-items:center;
gap:4px;
cursor:pointer;
}

.ldot{
width:11px;
height:11px;
border-radius:50%;
}

.ldot-blue{background:var(--blue)}
.ldot-red{background:var(--red)}
.ldot-orange{background:var(--orange)}
.ldot-grey{background:var(--grey)}

.lcount{
background:rgba(255,255,255,.2);
padding:1px 6px;
border-radius:8px;
font-weight:700;
}

/* MAP */

.map-container{
flex:1;
}

#map{
height:100%;
}

/* ANALYTICS */

.analytics-panel{
background:#fff8dc;
padding:8px 16px;
font-size:.88rem;
border-bottom:2px solid #f0c040;
}

/* TABLE */

.table-section{
height:200px;
display:flex;
flex-direction:column;
background:white;
border-top:1px solid var(--border);
}

.resize-handle{
height:6px;
background:#ddd;
cursor:ns-resize;
}

.table-scroll{
flex:1;
overflow:auto;
}

table{
width:100%;
border-collapse:collapse;
font-size:.85rem;
}

th{
background:var(--hdr);
color:white;
padding:7px;
position:sticky;
top:0;
}

td{
padding:7px;
border-bottom:1px solid #eee;
}

tr:hover{
background:#eaf2ff;
cursor:pointer;
}

/* MARKERS */

.animal-marker{
border-radius:50%;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-weight:700;
font-size:11px;
border:2px solid white;
box-shadow:0 2px 6px rgba(0,0,0,.5);
}

.mk-blue{background:var(--blue)}
.mk-red{background:var(--red)}
.mk-orange{background:var(--orange)}
.mk-grey{background:var(--grey)}

</style>

</head>

<body>

<header>

<div>
<img src="image.png">
<img src="unnamed.png">
</div>

<h1>🐊 Pali FT Hatchlings Telemetry Dashboard</h1>

<div class="legend-bar">

<div class="legend-item" onclick="filterStatus('active')">
<div class="ldot ldot-blue"></div>Active
<span class="lcount" id="countActive">0</span>
</div>

<div class="legend-item" onclick="filterStatus('dead')">
<div class="ldot ldot-red"></div>Dead
<span class="lcount" id="countDead">0</span>
</div>

<div class="legend-item" onclick="filterStatus('tmiss')">
<div class="ldot ldot-orange"></div>Temp Missing
<span class="lcount" id="countTmiss">0</span>
</div>

<div class="legend-item" onclick="filterStatus('gone')">
<div class="ldot ldot-grey"></div>Gone >30d
<span class="lcount" id="countGone">0</span>
</div>

</div>

</header>

<div class="analytics-panel" id="analyticsPanel">
Loading telemetry analytics...
</div>

<div class="map-container">
<div id="map"></div>
</div>

<div class="table-section" id="tableSection">

<div class="resize-handle" id="resizeHandle"></div>

<div class="table-scroll">

<table id="dataTable">

<thead>
<tr>
<th>ID</th>
<th>Timestamp</th>
<th>Place</th>
<th>Activity</th>
<th>Signal</th>
<th>Status</th>
<th>Latitude</th>
<th>Longitude</th>
<th>Remarks</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/OverlappingMarkerSpiderfier-Leaflet/0.2.6/oms.min.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<script>

const CSV_URL="https://docs.google.com/spreadsheets/d/10maxgDHDOISlVaN3kuc0_BjxOwPVysci5AiFL-WAxoQ/export?format=csv&gid=0"

const DEAD_IDS=new Set(['30','33','34','38','96','64','98'])

const TEMP_MISSING_DAYS=10
const GONE_DAYS=30

let map,oms,heatLayer

let rawData=[]
let latestRecords={}
let statusMap={}
let markers=[]

function init(){

map=L.map("map").setView([25.84,76.56],13)

L.tileLayer('http://mt0.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',{maxZoom:20}).addTo(map)

oms=new OverlappingMarkerSpiderfier(map,{
keepSpiderfied:true,
nearbyDistance:60,
circleSpiralSwitchover:100,
circleFootSeparation:60,
spiralFootSeparation:55,
spiralLengthStart:25,
spiralLengthFactor:8,
legWeight:2.5,
legColors:{usual:'#FFD700'}
})

loadData()

}

function loadData(){

Papa.parse(CSV_URL,{
download:true,
header:true,
skipEmptyLines:true,
complete:r=>{

rawData=r.data

process()

renderMap(Object.values(latestRecords))

renderTable(Object.values(latestRecords))

updateCounts()

}

})

}

function process(){

rawData.forEach(r=>{

let id=r["Animal ID"]

let d=new Date(r["Timestamp"])

if(!latestRecords[id]||new Date(latestRecords[id]["Timestamp"])<d){

latestRecords[id]=r

}

})

for(let id in latestRecords){

statusMap[id]=computeStatus(id,latestRecords[id])

}

}

function computeStatus(id,r){

if(DEAD_IDS.has(id)) return "dead"

let days=(Date.now()-new Date(r.Timestamp))/86400000

if(days>GONE_DAYS) return "gone"

if(days>TEMP_MISSING_DAYS) return "tmiss"

return "active"

}

function icon(id){

let s=statusMap[id]

let cls=s==="dead"?"mk-red":s==="tmiss"?"mk-orange":s==="gone"?"mk-grey":"mk-blue"

return L.divIcon({
className:"animal-marker "+cls,
html:id,
iconSize:[28,28],
iconAnchor:[14,14]
})

}

function renderMap(rows){

markers.forEach(m=>map.removeLayer(m))
markers=[]

rows.forEach(r=>{

let lat=parseFloat(r.Latitude)
let lng=parseFloat(r.Longitude)

if(!lat) return

let m=L.marker([lat,lng],{icon:icon(r["Animal ID"])}).addTo(map)

m.bindPopup(`
<b>ID ${r["Animal ID"]}</b><br>
${r.Timestamp}<br>
${r.Place}<br>
Signal: ${r.Signal||""}
`)

oms.addMarker(m)

markers.push(m)

})

}

function renderTable(rows){

let tbody=document.querySelector("#dataTable tbody")

tbody.innerHTML=""

rows.forEach(r=>{

let id=r["Animal ID"]

let tr=document.createElement("tr")

tr.innerHTML=`
<td>${id}</td>
<td>${r.Timestamp}</td>
<td>${r.Place}</td>
<td>${r.Activity}</td>
<td>${r.Signal||""}</td>
<td>${statusMap[id]}</td>
<td>${r.Latitude}</td>
<td>${r.Longitude}</td>
<td>${r.Remarks||""}</td>
`

tbody.appendChild(tr)

})

}

function updateCounts(){

let c={active:0,dead:0,tmiss:0,gone:0}

for(let id in statusMap){

c[statusMap[id]]++

}

document.getElementById("countActive").textContent=c.active
document.getElementById("countDead").textContent=c.dead
document.getElementById("countTmiss").textContent=c.tmiss
document.getElementById("countGone").textContent=c.gone

document.getElementById("analyticsPanel").innerHTML=

`Survival: <b>${c.active}</b> active of <b>${Object.keys(statusMap).length}</b> animals`

}

function filterStatus(type){

let rows=[]

for(let id in latestRecords){

if(statusMap[id]===type) rows.push(latestRecords[id])

}

renderMap(rows)

renderTable(rows)

}

function toggleHeatmap(){

if(heatLayer){

map.removeLayer(heatLayer)
heatLayer=null
return

}

let pts=[]

rawData.forEach(r=>{

let lat=parseFloat(r.Latitude)
let lng=parseFloat(r.Longitude)

if(!isNaN(lat)) pts.push([lat,lng,.6])

})

heatLayer=L.heatLayer(pts,{radius:25,blur:20}).addTo(map)

}

document.addEventListener("DOMContentLoaded",init)

</script>

</body>
</html>

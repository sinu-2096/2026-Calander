```html
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Pali FT Hatchlings Telemetry Dashboard</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/OverlappingMarkerSpiderfier-Leaflet/0.2.6/oms.min.js"></script>

<style>

body{
margin:0;
font-family:Segoe UI,Arial;
background:#f4f6f9;
color:#333;
}

header{
height:70px;
background:#2c3e50;
color:white;
display:flex;
align-items:center;
justify-content:center;
position:relative;
}

header h1{
font-size:20px;
margin:0;
}

.logo-left img{
position:absolute;
left:20px;
height:42px;
}

.logo-right img{
position:absolute;
right:20px;
height:42px;
}

.top-panel{
display:flex;
align-items:center;
gap:15px;
padding:10px 20px;
background:white;
border-bottom:1px solid #ddd;
}

select{
padding:6px;
}

button{
padding:6px 12px;
background:#27ae60;
border:none;
color:white;
border-radius:4px;
cursor:pointer;
}

button:hover{
background:#1f8d4e;
}

.status-dot{
width:8px;
height:8px;
background:#27ae60;
border-radius:50%;
display:inline-block;
margin-right:5px;
animation:blink 2s infinite;
}

@keyframes blink{
0%{opacity:1}
50%{opacity:.2}
100%{opacity:1}
}

.map-container{
padding:20px;
}

#map{
height:70vh;
border-radius:8px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.table-container{
padding:20px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th{
background:#2c3e50;
color:white;
padding:10px;
}

td{
padding:8px;
border-bottom:1px solid #eee;
}

tr:hover{
background:#f1f1f1;
}

#updatesPanel{
position:fixed;
right:-350px;
top:0;
width:350px;
height:100%;
background:white;
box-shadow:-5px 0 20px rgba(0,0,0,0.2);
transition:0.3s;
padding:20px;
overflow-y:auto;
}

#updatesPanel.open{
right:0;
}

.update-item{
margin-bottom:15px;
border-left:3px solid #27ae60;
padding-left:10px;
}

</style>

</head>

<body>

<header>

<div class="logo-left">
<img src="unnamed.png">
</div>

<h1>🐊 Pali FT Hatchlings Telemetry Dashboard</h1>

<div class="logo-right">
<img src="image.png">
</div>

</header>

<div class="top-panel">

<select id="animalFilter">
<option value="all">All Hatchlings</option>
</select>

<button onclick="toggleUpdates()">Field Updates</button>

<div>
<span class="status-dot"></span>
<span id="statusText">Loading telemetry...</span>
</div>

</div>

<div class="map-container">
<div id="map"></div>
</div>

<div class="table-container">

<table id="dataTable">

<thead>
<tr>
<th>Animal ID</th>
<th>Timestamp</th>
<th>Place</th>
<th>Activity</th>
<th>Signal</th>
<th>Latitude</th>
<th>Longitude</th>
<th>Remarks</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

<div id="updatesPanel">

<h3>Field Updates</h3>
<div id="updatesContent"></div>

</div>

<script>

/* GOOGLE SHEET CSV LINKS */

const TELEMETRY_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-f3JOwQZSlcBmpp4JO_Owut9JogW7KZYfJj5PONOc1TXE73xjvypZ1w6mWvvNzjFTaShiR6oYtzdt/pub?gid=0&single=true&output=csv";

const UPDATES_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-f3JOwQZSlcBmpp4JO_Owut9JogW7KZYfJj5PONOc1TXE73xjvypZ1w6mWvvNzjFTaShiR6oYtzdt/pub?gid=238985281&single=true&output=csv";

let map;
let markerLayer;
let oms;

let telemetry=[];
let animals={};

/* INITIALIZE MAP */

function init(){

map=L.map("map").setView([25.84,76.56],13);

L.tileLayer(
"http://mt0.google.com/vt/lyrs=y&x={x}&y={y}&z={z}"
).addTo(map);

markerLayer=L.layerGroup().addTo(map);

oms=new OverlappingMarkerSpiderfier(map);

loadTelemetry();

}

/* LOAD TELEMETRY */

function loadTelemetry(){

Papa.parse(TELEMETRY_CSV,{
download:true,
header:true,
complete:function(res){

telemetry=res.data;

processData();

renderDashboard("all");

document.getElementById("statusText").textContent="Telemetry Loaded";

}
});

}

/* PROCESS DATA */

function processData(){

animals={};

telemetry.forEach(r=>{

const id=r["Animal ID"];
const lat=parseFloat(r["Latitude"]);
const lon=parseFloat(r["Longitude"]);

if(!id||isNaN(lat)||isNaN(lon)||lat===0) return;

if(!animals[id]) animals[id]=[];

animals[id].push(r);

});

populateDropdown();

}

/* DROPDOWN */

function populateDropdown(){

const select=document.getElementById("animalFilter");

Object.keys(animals).forEach(id=>{

const option=document.createElement("option");
option.value=id;
option.textContent=id;

select.appendChild(option);

});

select.addEventListener("change",e=>{
renderDashboard(e.target.value);
});

}

/* RENDER DASHBOARD */

function renderDashboard(id){

markerLayer.clearLayers();

if(id==="all"){

Object.keys(animals).forEach(a=>{
createMarker(animals[a][0]);
});

}else{

animals[id].forEach(r=>createMarker(r));

}

renderTable(id);

}

/* CREATE MARKER */

function createMarker(r){

const lat=parseFloat(r["Latitude"]);
const lon=parseFloat(r["Longitude"]);

const marker=L.circleMarker([lat,lon],{
radius:7,
color:"#007bff",
fillOpacity:0.8
});

marker.bindPopup(
"<b>ID:</b> "+r["Animal ID"]+
"<br><b>Place:</b> "+r["Place"]+
"<br><b>Activity:</b> "+r["Activity"]
);

marker.addTo(markerLayer);

oms.addMarker(marker);

}

/* RENDER TABLE */

function renderTable(selected){

const tbody=document.querySelector("#dataTable tbody");

tbody.innerHTML="";

let rows=[];

if(selected==="all"){
rows=telemetry;
}else{
rows=animals[selected];
}

rows.forEach(r=>{

const signal=r["Signal Strength"]||r["Signal Stength"]||"";

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${r["Animal ID"]}</td>
<td>${r["Timestamp"]}</td>
<td>${r["Place"]}</td>
<td>${r["Activity"]}</td>
<td>${signal}</td>
<td>${r["Latitude"]}</td>
<td>${r["Longitude"]}</td>
<td>${r["Remarks"]}</td>
`;

tbody.appendChild(tr);

});

}

/* FIELD UPDATES */

function toggleUpdates(){

const panel=document.getElementById("updatesPanel");

panel.classList.toggle("open");

if(panel.classList.contains("open")){
loadUpdates();
}

}

function loadUpdates(){

Papa.parse(UPDATES_CSV,{
download:true,
header:true,
complete:function(res){

const container=document.getElementById("updatesContent");

container.innerHTML="";

res.data.reverse().forEach(r=>{

const div=document.createElement("div");

div.className="update-item";

div.innerHTML="<b>"+r["Date"]+"</b><br>"+r["Update"];

container.appendChild(div);

});

}
});

}

document.addEventListener("DOMContentLoaded",init);

</script>

</body>
</html>

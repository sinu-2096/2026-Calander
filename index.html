<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wildlife Telemetry Monitor</title>

  <!-- ─── Leaflet CSS ─────────────────────────────────────────────────── -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- ─── Google Fonts: Rajdhani (headings) + Share Tech Mono (data) ─── -->
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

  <style>
    /* ══════════════════════════════════════════════
       DESIGN TOKENS / CSS VARIABLES
    ══════════════════════════════════════════════ */
    :root {
      --bg:          #060d15;
      --panel:       rgba(8, 18, 32, 0.93);
      --panel-light: rgba(12, 25, 44, 0.88);
      --border:      rgba(0, 210, 160, 0.18);
      --accent:      #00d2a0;
      --accent-dim:  rgba(0, 210, 160, 0.12);
      --text:        #c2d8e8;
      --text-dim:    #5a7e96;
      --text-bright: #e8f4ff;

      /* Status colours */
      --c-green:   #00e676;
      --c-purple:  #ce93d8;
      --c-yellow:  #ffd54f;
      --c-red:     #ff5252;

      /* Pill backgrounds */
      --pill-green:  rgba(0, 230, 118, 0.12);
      --pill-purple: rgba(206, 147, 216, 0.12);
      --pill-yellow: rgba(255, 213, 79, 0.12);
      --pill-red:    rgba(255, 82, 82, 0.14);

      --header-h: 56px;
      --panel-w: 320px;
      --font-mono: 'Share Tech Mono', monospace;
      --font-ui:   'Rajdhani', sans-serif;
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-ui); }

    /* ══════════════════════════════════════════════
       HEADER BAR
    ══════════════════════════════════════════════ */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      z-index: 1000;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* Paw-print logo mark */
    #logo {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
    }
    #logo svg { width: 28px; height: 28px; }
    #logo-text {
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-bright);
      line-height: 1.15;
    }
    #logo-text span {
      display: block;
      font-size: 9px;
      letter-spacing: 0.22em;
      color: var(--accent);
      font-weight: 600;
    }

    /* Vertical divider */
    .vdiv {
      width: 1px; height: 30px;
      background: var(--border);
      flex-shrink: 0;
    }

    /* ── Status Pills ── */
    #status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #status-bar::-webkit-scrollbar { display: none; }

    .pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 11px;
      border-radius: 3px;
      font-family: var(--font-ui);
      font-weight: 600;
      font-size: 12.5px;
      letter-spacing: 0.04em;
      white-space: nowrap;
      border: 1px solid transparent;
      cursor: default;
      transition: opacity 0.3s;
    }
    .pill.new     { background: var(--accent-dim); color: var(--accent); border-color: rgba(0,210,160,0.25); }
    .pill.warn7   { background: var(--pill-purple); color: var(--c-purple); border-color: rgba(206,147,216,0.25); }
    .pill.warn30  { background: var(--pill-yellow); color: var(--c-yellow); border-color: rgba(255,213,79,0.3); }
    .pill.crit45  { background: var(--pill-red);   color: var(--c-red);   border-color: rgba(255,82,82,0.3); }
    .pill .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .pill.new   .dot { background: var(--accent); }
    .pill.warn7 .dot { background: var(--c-purple); }
    .pill.warn30 .dot { background: var(--c-yellow); }
    .pill.crit45 .dot { background: var(--c-red); box-shadow: 0 0 5px var(--c-red); }

    /* ── Header right cluster ── */
    #header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      margin-left: auto;
    }

    #last-sync {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      text-align: right;
      line-height: 1.4;
    }
    #last-sync strong { color: var(--accent); display: block; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; }

    /* Refresh & toggle buttons */
    .icon-btn {
      width: 32px; height: 32px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--accent-dim);
      color: var(--accent);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }
    .icon-btn:hover { background: rgba(0,210,160,0.22); border-color: var(--accent); }
    .icon-btn svg { width: 16px; height: 16px; }
    .icon-btn.active { background: rgba(0,210,160,0.28); border-color: var(--accent); }

    /* Refresh spinning state */
    @keyframes spin { to { transform: rotate(360deg); } }
    .icon-btn.loading svg { animation: spin 0.9s linear infinite; }

    /* ══════════════════════════════════════════════
       MAP
    ══════════════════════════════════════════════ */
    #map {
      position: fixed;
      top: var(--header-h);
      left: 0; right: 0; bottom: 0;
      z-index: 1;
    }

    /* ── Leaflet popup overrides ── */
    .leaflet-popup-content-wrapper {
      background: var(--panel) !important;
      border: 1px solid var(--border) !important;
      border-radius: 6px !important;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7) !important;
      backdrop-filter: blur(14px);
      color: var(--text) !important;
      padding: 0 !important;
      min-width: 230px;
    }
    .leaflet-popup-tip { background: rgba(8,18,32,0.95) !important; }
    .leaflet-popup-close-button {
      color: var(--text-dim) !important;
      font-size: 18px !important;
      top: 8px !important; right: 10px !important;
    }
    .leaflet-popup-close-button:hover { color: var(--accent) !important; }
    .leaflet-container { background: #070d15 !important; }

    /* ─── Custom Popup Content ─── */
    .popup-inner {
      padding: 14px 16px 12px;
    }
    .popup-header {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .popup-color-bar {
      width: 4px;
      border-radius: 2px;
      flex-shrink: 0;
      align-self: stretch;
      min-height: 32px;
    }
    .popup-collar {
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 16px;
      color: var(--text-bright);
      letter-spacing: 0.04em;
    }
    .popup-radio {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 0.06em;
      margin-top: 1px;
    }
    .popup-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 5px;
    }
    .popup-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .popup-value {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-bright);
    }
    .popup-days {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 9px;
      border-radius: 3px;
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.05em;
    }

    /* ══════════════════════════════════════════════
       COLLAR LIST PANEL (collapsible, right side)
    ══════════════════════════════════════════════ */
    #panel {
      position: fixed;
      top: var(--header-h);
      right: 0;
      width: var(--panel-w);
      bottom: 0;
      z-index: 900;
      background: var(--panel);
      border-left: 1px solid var(--border);
      transform: translateX(100%);
      transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(14px);
    }
    #panel.open { transform: translateX(0); }

    #panel-header {
      padding: 13px 16px 11px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    #collar-count {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 400;
    }

    /* Search / filter within panel */
    #panel-search-wrap {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #panel-search {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 11.5px;
      padding: 6px 10px;
      outline: none;
      transition: border-color 0.2s;
    }
    #panel-search::placeholder { color: var(--text-dim); }
    #panel-search:focus { border-color: var(--accent); }

    /* Collar list */
    #collar-list {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(0,210,160,0.2) transparent;
    }
    #collar-list::-webkit-scrollbar { width: 4px; }
    #collar-list::-webkit-scrollbar-track { background: transparent; }
    #collar-list::-webkit-scrollbar-thumb { background: rgba(0,210,160,0.25); border-radius: 2px; }

    .collar-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border-bottom: 1px solid rgba(0,210,160,0.06);
      cursor: pointer;
      transition: background 0.15s;
    }
    .collar-item:hover { background: rgba(0,210,160,0.06); }
    .collar-item:last-child { border-bottom: none; }

    .ci-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .ci-info { flex: 1; min-width: 0; }
    .ci-collar {
      font-family: var(--font-ui);
      font-weight: 600;
      font-size: 13px;
      color: var(--text-bright);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ci-meta {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 2px;
    }
    .ci-days {
      font-family: var(--font-mono);
      font-size: 11px;
      flex-shrink: 0;
      text-align: right;
    }

    /* Legend (bottom-left corner of map) */
    #legend {
      position: fixed;
      bottom: 22px;
      left: 14px;
      z-index: 900;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 13px;
      backdrop-filter: blur(12px);
    }
    #legend-title {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 7px;
    }
    .leg-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
      font-size: 11.5px;
      color: var(--text);
    }
    .leg-row:last-child { margin-bottom: 0; }
    .leg-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Custom marker pulse ring for green (≤7 days) ── */
    @keyframes markerPulse {
      0%   { transform: scale(1); opacity: 0.7; }
      70%  { transform: scale(2.4); opacity: 0; }
      100% { transform: scale(1); opacity: 0; }
    }
    .marker-wrap { position: relative; }
    .marker-ring {
      position: absolute;
      top: 50%; left: 50%;
      width: 100%; height: 100%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      animation: markerPulse 2.4s ease-out infinite;
      pointer-events: none;
    }

    /* ── Loading overlay ── */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      transition: opacity 0.5s, visibility 0.5s;
    }
    #loading.hidden { opacity: 0; visibility: hidden; }
    .loader-ring {
      width: 48px; height: 48px;
      border: 3px solid rgba(0,210,160,0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    #loading p {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 0.08em;
    }

    /* ── Error toast ── */
    #toast {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 3000;
      background: rgba(255,82,82,0.18);
      border: 1px solid rgba(255,82,82,0.4);
      color: var(--c-red);
      padding: 9px 18px;
      border-radius: 5px;
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.04em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Responsive: hide panel on very small screens when toggled ── */
    @media (max-width: 500px) {
      :root { --panel-w: 100vw; }
    }
  </style>
</head>
<body>

  <!-- ══════════════════════════════════════════════════════════
       LOADING OVERLAY
  ══════════════════════════════════════════════════════════ -->
  <div id="loading">
    <div class="loader-ring"></div>
    <p>FETCHING TELEMETRY DATA…</p>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       HEADER BAR
  ══════════════════════════════════════════════════════════ -->
  <header id="header">

    <!-- Logo -->
    <div id="logo">
      <!-- Paw-print SVG icon -->
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="20" r="7" fill="rgba(0,210,160,0.15)" stroke="#00d2a0" stroke-width="1.4"/>
        <circle cx="10" cy="12" r="3.5" fill="rgba(0,210,160,0.12)" stroke="#00d2a0" stroke-width="1.2"/>
        <circle cx="22" cy="12" r="3.5" fill="rgba(0,210,160,0.12)" stroke="#00d2a0" stroke-width="1.2"/>
        <circle cx="6" cy="18" r="2.8" fill="rgba(0,210,160,0.1)" stroke="#00d2a0" stroke-width="1.1"/>
        <circle cx="26" cy="18" r="2.8" fill="rgba(0,210,160,0.1)" stroke="#00d2a0" stroke-width="1.1"/>
        <circle cx="16" cy="21" r="2.5" fill="#00d2a0" opacity="0.6"/>
      </svg>
      <div id="logo-text">
        Telemetry Monitor
        <span>Wildlife Field Operations</span>
      </div>
    </div>

    <div class="vdiv"></div>

    <!-- Status Pills - populated by JS -->
    <div id="status-bar">
      <div class="pill new"   id="pill-new">  <div class="dot"></div> <span>—</span></div>
      <div class="pill warn7" id="pill-w7">   <div class="dot"></div> <span>—</span></div>
      <div class="pill warn30" id="pill-w30"> <div class="dot"></div> <span>—</span></div>
      <div class="pill crit45" id="pill-c45"> <div class="dot"></div> <span>—</span></div>
    </div>

    <!-- Right cluster: sync time, refresh, list toggle -->
    <div id="header-right">
      <div id="last-sync">
        <strong>Last Sync</strong>
        <span id="sync-time">—</span>
      </div>

      <!-- Refresh button -->
      <button class="icon-btn" id="btn-refresh" title="Refresh now" onclick="refreshData()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>

      <!-- List toggle button -->
      <button class="icon-btn" id="btn-list" title="Toggle collar list" onclick="togglePanel()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- ══════════════════════════════════════════════════════════
       MAP
  ══════════════════════════════════════════════════════════ -->
  <div id="map"></div>

  <!-- ══════════════════════════════════════════════════════════
       LEGEND (bottom-left, fixed)
  ══════════════════════════════════════════════════════════ -->
  <div id="legend">
    <div id="legend-title">Signal Age</div>
    <div class="leg-row"><div class="leg-dot" style="background:var(--c-green)"></div> ≤ 7 days</div>
    <div class="leg-row"><div class="leg-dot" style="background:var(--c-purple)"></div> 8 – 30 days</div>
    <div class="leg-row"><div class="leg-dot" style="background:var(--c-yellow)"></div> 31 – 44 days</div>
    <div class="leg-row"><div class="leg-dot" style="background:var(--c-red)"></div> ≥ 45 days</div>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       COLLAR LIST PANEL
  ══════════════════════════════════════════════════════════ -->
  <aside id="panel">
    <div id="panel-header">
      Collar Inventory
      <span id="collar-count">—</span>
    </div>
    <div id="panel-search-wrap">
      <input id="panel-search" type="text" placeholder="Search collar / radio ID…" oninput="filterList(this.value)" />
    </div>
    <div id="collar-list"></div>
  </aside>

  <!-- ── Error Toast ── -->
  <div id="toast"></div>

  <!-- ══════════════════════════════════════════════════════════
       LEAFLET JS
  ══════════════════════════════════════════════════════════ -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    /* ────────────────────────────────────────────────────────────
       CONFIGURATION
    ──────────────────────────────────────────────────────────── */

    // Google Sheets published CSV URL
    // The sheet must be: File → Share → Publish to web → CSV
    // OR it can be exported directly from its spreadsheet ID:
    const SHEET_ID  = '13HfRGsqKmVihmGYACi8nWgLTsV2kYKM83gBvVmWSfXw';
    const SHEET_GID = '0';
    const CSV_URL   = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${SHEET_GID}`;

    // Auto-refresh interval (milliseconds). 6 hours = 21600000 ms
    const REFRESH_INTERVAL = 6 * 60 * 60 * 1000;

    // Column names (must match sheet header row exactly, case-sensitive)
    const COL = {
      collar : 'CollarSerialNumber',
      lat    : 'Latitude',
      lon    : 'Longitude',
      date   : 'Date',
      radio  : 'RadioID',
    };

    /* ────────────────────────────────────────────────────────────
       STATE
    ──────────────────────────────────────────────────────────── */
    let map;            // Leaflet map instance
    let markerLayer;    // LayerGroup holding all markers
    let currentData = []; // Parsed records from last fetch
    let panelOpen   = false;
    let filterText  = '';

    /* ────────────────────────────────────────────────────────────
       INITIALISE MAP
       Basemap: ESRI World Imagery (satellite) + ESRI labels (hybrid)
       Drop-in Google equivalent; swap tile URLs below if you have
       a valid Google Maps API key and wish to use Google tiles.
    ──────────────────────────────────────────────────────────── */
    function initMap() {
      map = L.map('map', {
        center:          [25.9, 76.8],   // Rough centre of data extent
        zoom:            10,
        zoomControl:     false,           // We'll position it manually
        attributionControl: false,
      });

      // ── Satellite imagery layer (ESRI) ──────────────────────
      L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        { maxZoom: 19, attribution: '© Esri, Maxar, Earthstar Geographics' }
      ).addTo(map);

      // ── Labels + roads overlay (hybrid effect) ───────────────
      L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
        { maxZoom: 19, opacity: 0.85 }
      ).addTo(map);

      // ── Zoom control (bottom-right) ──────────────────────────
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      // ── Attribution (bottom-right, minimal) ──────────────────
      L.control.attribution({ position: 'bottomright', prefix: false })
        .addAttribution('Imagery © Esri | Telemetry data fetched from Google Sheets')
        .addTo(map);

      // ── Marker layer group ───────────────────────────────────
      markerLayer = L.layerGroup().addTo(map);
    }

    /* ────────────────────────────────────────────────────────────
       COLOUR LOGIC
       Returns hex colour string based on days since last fix.
    ──────────────────────────────────────────────────────────── */
    function markerColor(days) {
      if (days <= 7)  return '#00e676';  // Green  – recent
      if (days <= 30) return '#ce93d8';  // Purple – moderate
      if (days <  45) return '#ffd54f';  // Yellow – stale
      return '#ff5252';                  // Red    – critical
    }

    function markerLabel(days) {
      if (days <= 7)  return '≤ 7 days';
      if (days <= 30) return `${days}d`;
      if (days <  45) return `${days}d`;
      return `${days}d – CRITICAL`;
    }

    /* ────────────────────────────────────────────────────────────
       BUILD CUSTOM SVG DIV ICON
       Uses a coloured circle with optional pulse ring for recent.
    ──────────────────────────────────────────────────────────── */
    function buildIcon(color, isRecent) {
      const size  = isRecent ? 14 : 12;
      const pulse = isRecent
        ? `<div class="marker-ring" style="background:${color};opacity:0.35;"></div>`
        : '';

      const html = `
        <div class="marker-wrap" style="width:${size}px;height:${size}px;">
          ${pulse}
          <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
            <circle cx="${size/2}" cy="${size/2}" r="${size/2 - 1}"
              fill="${color}" stroke="rgba(255,255,255,0.55)" stroke-width="1.5"/>
          </svg>
        </div>`;

      return L.divIcon({
        html,
        className : '',
        iconSize  : [size, size],
        iconAnchor: [size/2, size/2],
        popupAnchor:[0, -(size/2 + 6)],
      });
    }

    /* ────────────────────────────────────────────────────────────
       DATE UTILITIES
    ──────────────────────────────────────────────────────────── */

    // Calculate days elapsed from an ISO date string to now
    function daysSince(isoString) {
      const then = new Date(isoString);
      const now  = new Date();
      const ms   = now - then;
      return Math.floor(ms / (1000 * 60 * 60 * 24));
    }

    // Format ISO date to DD-MM-YYYY HH:MM:SS
    function formatDate(isoString) {
      const d = new Date(isoString);
      if (isNaN(d)) return '—';
      const pad = n => String(n).padStart(2, '0');
      return `${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()} ` +
             `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    /* ────────────────────────────────────────────────────────────
       BUILD POPUP HTML
    ──────────────────────────────────────────────────────────── */
    function buildPopup(rec) {
      const color = markerColor(rec.days);
      const bg    = color + '22';  // Semi-transparent background for days badge

      return `
        <div class="popup-inner">
          <div class="popup-header">
            <div class="popup-color-bar" style="background:${color}"></div>
            <div>
              <div class="popup-collar">#${rec.collar}</div>
              <div class="popup-radio">Radio: ${rec.radio}</div>
            </div>
          </div>

          <div class="popup-row">
            <span class="popup-label">Latitude</span>
            <span class="popup-value">${parseFloat(rec.lat).toFixed(5)}°</span>
          </div>
          <div class="popup-row">
            <span class="popup-label">Longitude</span>
            <span class="popup-value">${parseFloat(rec.lon).toFixed(5)}°</span>
          </div>
          <div class="popup-row">
            <span class="popup-label">Last Fix</span>
            <span class="popup-value">${formatDate(rec.date)}</span>
          </div>

          <div style="margin-top:8px;">
            <span class="popup-days" style="background:${bg};color:${color};border:1px solid ${color}44;">
              ${rec.days === 0 ? 'Today' : rec.days + ' day' + (rec.days !== 1 ? 's' : '') + ' ago'}
            </span>
          </div>
        </div>`;
    }

    /* ────────────────────────────────────────────────────────────
       RENDER MARKERS
       Clears previous markers, rebuilds from currentData.
    ──────────────────────────────────────────────────────────── */
    function renderMarkers() {
      markerLayer.clearLayers();

      currentData.forEach(rec => {
        const lat = parseFloat(rec.lat);
        const lon = parseFloat(rec.lon);

        // Skip if coordinates are invalid
        if (isNaN(lat) || isNaN(lon)) return;

        const color    = markerColor(rec.days);
        const isRecent = rec.days <= 7;
        const icon     = buildIcon(color, isRecent);

        const marker = L.marker([lat, lon], { icon })
          .bindPopup(buildPopup(rec), {
            maxWidth  : 280,
            className : 'telemetry-popup',
          });

        markerLayer.addLayer(marker);
      });
    }

    /* ────────────────────────────────────────────────────────────
       UPDATE STATUS PILLS
    ──────────────────────────────────────────────────────────── */
    function updateStatusPills(newCount) {
      const w7  = currentData.filter(r => r.days > 7).length;
      const w30 = currentData.filter(r => r.days > 30).length;
      const c45 = currentData.filter(r => r.days >= 45).length;

      setpill('pill-new', `📍 ${newCount} new location${newCount !== 1 ? 's' : ''} detected`);
      setpill('pill-w7',  `⚠️ ${w7} radio${w7 !== 1 ? 's' : ''} silent > 7 days`);
      setpill('pill-w30', `🚨 ${w30} radio${w30 !== 1 ? 's' : ''} silent > 30 days`);
      setpill('pill-c45', `🛑 ${c45} radio${c45 !== 1 ? 's' : ''} silent ≥ 45 days`);
    }

    function setpill(id, text) {
      const el = document.getElementById(id);
      if (el) el.querySelector('span').textContent = text;
    }

    /* ────────────────────────────────────────────────────────────
       DETECT NEW LOCATIONS
       Compares current data against last-known state stored in
       localStorage.  A "new location" = a collar whose Date
       timestamp differs from what was stored previously.
    ──────────────────────────────────────────────────────────── */
    function detectNewLocations(records) {
      const LS_KEY = 'telemetry_last_seen';
      let lastSeen = {};

      try {
        lastSeen = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
      } catch(e) { /* ignore parse error */ }

      // Build new snapshot and count changed entries
      const snapshot  = {};
      let   newCount  = 0;

      records.forEach(rec => {
        snapshot[rec.collar] = rec.date;
        if (lastSeen[rec.collar] !== rec.date) newCount++;
      });

      // Save snapshot for next refresh
      try { localStorage.setItem(LS_KEY, JSON.stringify(snapshot)); }
      catch(e) { /* storage may be unavailable */ }

      return newCount;
    }

    /* ────────────────────────────────────────────────────────────
       PARSE CSV TEXT → ARRAY OF OBJECTS
       Handles quoted fields and trims whitespace.
    ──────────────────────────────────────────────────────────── */
    function parseCSV(raw) {
      const lines = raw.trim().split('\n');
      if (lines.length < 2) return [];

      // Header row: split by comma, trim each field
      const headers = lines[0].split(',').map(h => h.trim());

      const records = [];
      for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        // Simple CSV split (handles quoted commas)
        const values = splitCSVLine(line);
        if (values.length < headers.length) continue;

        const obj = {};
        headers.forEach((h, idx) => {
          obj[h] = (values[idx] || '').trim();
        });

        // Validate required fields
        const lat = parseFloat(obj[COL.lat]);
        const lon = parseFloat(obj[COL.lon]);
        if (!obj[COL.collar] || isNaN(lat) || isNaN(lon)) continue;

        // Calculate days since last fix
        const days = daysSince(obj[COL.date]);

        records.push({
          collar : obj[COL.collar],
          lat    : obj[COL.lat],
          lon    : obj[COL.lon],
          date   : obj[COL.date],
          radio  : obj[COL.radio] || '—',
          days   : isNaN(days) ? 9999 : Math.max(0, days),
        });
      }

      // Sort: most recent first
      records.sort((a, b) => a.days - b.days);
      return records;
    }

    // Split a CSV line respecting quoted fields
    function splitCSVLine(line) {
      const result = [];
      let   cur    = '';
      let   inQuote = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          inQuote = !inQuote;
        } else if (ch === ',' && !inQuote) {
          result.push(cur);
          cur = '';
        } else {
          cur += ch;
        }
      }
      result.push(cur);
      return result;
    }

    /* ────────────────────────────────────────────────────────────
       FETCH DATA FROM GOOGLE SHEETS (published CSV)
    ──────────────────────────────────────────────────────────── */
    async function fetchData() {
      // Add cache-busting timestamp so browsers don't serve stale CSV
      const url = `${CSV_URL}&cachebust=${Date.now()}`;

      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      return await resp.text();
    }

    /* ────────────────────────────────────────────────────────────
       MAIN REFRESH FLOW
    ──────────────────────────────────────────────────────────── */
    async function refreshData() {
      const btn = document.getElementById('btn-refresh');
      btn.classList.add('loading');

      try {
        const raw    = await fetchData();
        currentData  = parseCSV(raw);

        if (currentData.length === 0) {
          showToast('No records found in sheet. Check column headers.');
          return;
        }

        // Detect new locations vs previous run
        const newCount = detectNewLocations(currentData);

        // Render map markers
        renderMarkers();

        // Update status pills
        updateStatusPills(newCount);

        // Update collar panel list
        renderCollarList();

        // Record sync time
        document.getElementById('sync-time').textContent =
          new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        // Auto-fit map to data bounds on first load
        if (markerLayer.getLayers().length > 0) {
          const bounds = markerLayer.getLayers()
            .map(l => l.getLatLng ? l.getLatLng() : null)
            .filter(Boolean);
          if (bounds.length) map.fitBounds(L.latLngBounds(bounds), { padding: [40, 40] });
        }

      } catch (err) {
        console.error('Fetch error:', err);
        showToast(`Data fetch failed: ${err.message}`);
      } finally {
        btn.classList.remove('loading');
        document.getElementById('loading').classList.add('hidden');
      }
    }

    /* ────────────────────────────────────────────────────────────
       COLLAR LIST PANEL
    ──────────────────────────────────────────────────────────── */
    function renderCollarList(filter = '') {
      const list    = document.getElementById('collar-list');
      const count   = document.getElementById('collar-count');
      const records = filter
        ? currentData.filter(r =>
            r.collar.toLowerCase().includes(filter) ||
            r.radio.toLowerCase().includes(filter))
        : currentData;

      count.textContent = `${records.length} collars`;

      list.innerHTML = records.map(rec => {
        const color = markerColor(rec.days);
        const daysLabel = rec.days === 0 ? 'today' : `${rec.days}d ago`;
        return `
          <div class="collar-item" onclick="flyTo(${rec.lat},${rec.lon},'${rec.collar}')">
            <div class="ci-dot" style="background:${color}"></div>
            <div class="ci-info">
              <div class="ci-collar">#${rec.collar}</div>
              <div class="ci-meta">Radio: ${rec.radio}</div>
            </div>
            <div class="ci-days" style="color:${color}">${daysLabel}</div>
          </div>`;
      }).join('');
    }

    function filterList(val) {
      filterText = val.toLowerCase();
      renderCollarList(filterText);
    }

    // Fly to a marker and open its popup
    function flyTo(lat, lon, collar) {
      map.flyTo([parseFloat(lat), parseFloat(lon)], 14, { duration: 1.2 });

      // Find the matching marker and open its popup
      setTimeout(() => {
        markerLayer.getLayers().forEach(layer => {
          const ll = layer.getLatLng ? layer.getLatLng() : null;
          if (ll && Math.abs(ll.lat - lat) < 0.0001 && Math.abs(ll.lng - lon) < 0.0001) {
            layer.openPopup();
          }
        });
      }, 1300);
    }

    /* ────────────────────────────────────────────────────────────
       PANEL TOGGLE
    ──────────────────────────────────────────────────────────── */
    function togglePanel() {
      panelOpen = !panelOpen;
      document.getElementById('panel').classList.toggle('open', panelOpen);
      document.getElementById('btn-list').classList.toggle('active', panelOpen);
    }

    /* ────────────────────────────────────────────────────────────
       ERROR TOAST
    ──────────────────────────────────────────────────────────── */
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 5000);
    }

    /* ────────────────────────────────────────────────────────────
       BOOT
    ──────────────────────────────────────────────────────────── */
    (function boot() {
      // 1. Initialise the map
      initMap();

      // 2. First data load
      refreshData();

      // 3. Schedule automatic refresh every 6 hours
      setInterval(refreshData, REFRESH_INTERVAL);
    })();
  </script>
</body>
</html>

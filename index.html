<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pali FT Hatchlings Telemetry Dashboard</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

:root{
--map-height:68vh;
--primary-bg:#f4f6f9;
--header-bg:#1a2a3a;
--accent:#2980b9;
--border:#ddd;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Segoe UI,Tahoma,Verdana;
}

body{
background:var(--primary-bg);
display:flex;
flex-direction:column;
min-height:100vh;
}

/* HEADER */

header{
background:var(--header-bg);
color:white;
padding:10px 20px;
display:grid;
grid-template-columns:auto 1fr auto;
align-items:center;
}

header img{
height:40px;
}

header h1{
text-align:center;
font-size:1.35rem;
}

/* CONTROLS */

.top-panel{
background:white;
padding:10px 20px;
display:flex;
gap:20px;
align-items:center;
border-bottom:1px solid var(--border);
}

.filter-group{
display:flex;
gap:10px;
align-items:center;
}

select{
padding:6px 10px;
}

/* MAP */

.map-container{
height:var(--map-height);
}

#map{
height:100%;
}

/* ANALYTICS */

.analytics{
background:#fff8dc;
padding:12px 20px;
font-size:0.9rem;
border-bottom:2px solid #f0c040;
}

/* MARKERS */

.animal-marker{
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-weight:bold;
font-size:12px;
width:30px;
height:30px;
border:2px solid white;
box-shadow:0 2px 6px rgba(0,0,0,0.5);
}

.marker-live{
background:#007bff;
}

.marker-dead{
background:#e74c3c;
}

/* TABLE */

.table-container{
background:white;
padding:10px 20px;
max-height:260px;
overflow:auto;
resize:vertical;
}

table{
width:100%;
border-collapse:collapse;
font-size:0.85rem;
}

th{
background:#1a2a3a;
color:white;
padding:8px;
position:sticky;
top:0;
}

td{
padding:8px;
border-bottom:1px solid #eee;
}

tr:hover{
background:#dce8f5;
cursor:pointer;
}

/* FIELD PANEL */

.field-panel{
position:fixed;
right:-350px;
top:0;
width:340px;
height:100%;
background:white;
box-shadow:-4px 0 10px rgba(0,0,0,0.2);
transition:right 0.3s;
overflow:auto;
padding:20px;
z-index:999;
}

.field-panel.open{
right:0;
}

.field-btn{
padding:6px 14px;
background:#1a2a3a;
color:white;
border:none;
cursor:pointer;
}

</style>
</head>

<body>

<header>

<div>
<img src="image.png">
</div>

<h1>🐊 Pali FT Hatchlings Telemetry Dashboard</h1>

<div></div>

</header>

<div class="top-panel">

<div class="filter-group">
<label>Select Animal</label>
<select id="animalFilter">
<option value="all">All Animals</option>
</select>
</div>

<button class="field-btn" onclick="toggleField()">Field Updates</button>

</div>

<div class="analytics" id="analytics">
Loading analytics...
</div>

<div class="map-container">
<div id="map"></div>
</div>

<div class="table-container">

<table id="table">

<thead>
<tr>
<th>ID</th>
<th>Timestamp</th>
<th>Place</th>
<th>Activity</th>
<th>Signal</th>
<th>Latitude</th>
<th>Longitude</th>
<th>Remarks</th>
</tr>
</thead>

<tbody></tbody>

</table>

<button id="expandBtn">See More</button>

</div>

<div class="field-panel" id="fieldPanel">

<h3>Field Updates</h3>

<div id="updates"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/OverlappingMarkerSpiderfier-Leaflet/0.2.6/oms.min.js"></script>

<script>

/* CONFIG */

const CSV_URL="https://docs.google.com/spreadsheets/d/10maxgDHDOISlVaN3kuc0_BjxOwPVysci5AiFL-WAxoQ/export?format=csv&gid=0";

const UPDATE_URL="https://docs.google.com/spreadsheets/d/10maxgDHDOISlVaN3kuc0_BjxOwPVysci5AiFL-WAxoQ/export?format=csv&gid=238985281";

const MAP_CENTER=[25.84,76.56];

/* DEAD */

const DEAD_IDS=new Set(['30','33','34','38','96','64','98']);

/* STATE */

let map;
let oms;

let rawData=[];
let animals={};

let markers=[];
let lines=[];

let showAllRows=false;

/* INIT */

function init(){

map=L.map("map").setView(MAP_CENTER,13);

L.tileLayer('http://mt0.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',{
maxZoom:20
}).addTo(map);

oms=new OverlappingMarkerSpiderfier(map,{
nearbyDistance:40,
circleFootSeparation:50,
spiralFootSeparation:45
});

loadTelemetry();

loadUpdates();

document.getElementById("animalFilter").addEventListener("change",e=>{
updateDashboard(e.target.value)
})

}

/* LOAD DATA */

function loadTelemetry(){

Papa.parse(CSV_URL,{
download:true,
header:true,
skipEmptyLines:true,
complete:r=>{

rawData=r.data;

process();

populateFilter();

updateDashboard("all");

}
})

}

/* PROCESS */

function process(){

animals={};

rawData.forEach(r=>{

let id=r["Animal ID"];

if(!animals[id])animals[id]=[];

animals[id].push(r);

})

}

/* FILTER */

function populateFilter(){

let sel=document.getElementById("animalFilter");

Object.keys(animals).forEach(id=>{

let o=document.createElement("option");

o.value=id;

o.textContent="ID "+id;

sel.appendChild(o);

})

}

/* MAP */

function clearMap(){

markers.forEach(m=>map.removeLayer(m));

lines.forEach(l=>map.removeLayer(l));

markers=[];
lines=[];

}

/* ICON */

function icon(id){

let dead=DEAD_IDS.has(id);

return L.divIcon({

className:"animal-marker "+(dead?"marker-dead":"marker-live"),

html:id,

iconSize:[30,30],

iconAnchor:[15,15]

})

}

/* DASHBOARD */

function updateDashboard(id){

clearMap();

let rows=id==="all"?rawData:animals[id];

renderMap(rows);

renderTable(rows);

computeAnalytics();

}

/* MAP */

function renderMap(rows){

rows.forEach(r=>{

let lat=parseFloat(r.Latitude);

let lon=parseFloat(r.Longitude);

if(!lat||!lon)return;

let m=L.marker([lat,lon],{icon:icon(r["Animal ID"])}).addTo(map);

m.bindPopup(

"<b>ID "+r["Animal ID"]+"</b><br>"+

r.Timestamp+"<br>"+

r.Place+"<br>"+

r.Activity+"<br>"+

"Signal: "+(r["Signal Strength"]||"")

)

markers.push(m);

oms.addMarker(m);

})

}

/* TABLE */

function renderTable(rows){

let tbody=document.querySelector("#table tbody");

tbody.innerHTML="";

let limit=showAllRows?rows.length:5;

rows.slice(0,limit).forEach(r=>{

let tr=document.createElement("tr");

tr.innerHTML=

`<td>${r["Animal ID"]}</td>
<td>${r.Timestamp}</td>
<td>${r.Place}</td>
<td>${r.Activity}</td>
<td>${r["Signal Strength"]||""}</td>
<td>${r.Latitude}</td>
<td>${r.Longitude}</td>
<td>${r.Remarks||""}</td>`;

tbody.appendChild(tr);

})

}

/* EXPAND */

document.getElementById("expandBtn").onclick=()=>{

showAllRows=true;

updateDashboard(document.getElementById("animalFilter").value);

}

/* ANALYTICS */

function computeAnalytics(){

let alive=0;

let dead=0;

let maxMove=0;

Object.keys(animals).forEach(id=>{

if(DEAD_IDS.has(id))dead++;

else alive++;

})

document.getElementById("analytics").innerHTML=

"<b>Survival:</b> "+alive+" alive | "+dead+" dead / missing";

}

/* FIELD UPDATES */

function loadUpdates(){

Papa.parse(UPDATE_URL,{
download:true,
header:true,
complete:r=>{

let div=document.getElementById("updates");

r.data.forEach(u=>{

if(!u.Date)return;

let p=document.createElement("p");

p.innerHTML="<b>"+u.Date+"</b><br>"+u.Update;

div.appendChild(p);

})

}

})

}

function toggleField(){

document.getElementById("fieldPanel").classList.toggle("open");

}

document.addEventListener("DOMContentLoaded",init);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🐊 Chambal Gharial Dashboard</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Inter;
background:#eef2ef;
}

#header{
height:50px;
background:#1b3d2a;
color:white;
display:flex;
align-items:center;
padding:0 20px;
font-weight:600;
font-size:14px;
}

#map{
height:calc(100vh - 240px);
width:100%;
}

/* marker */

.mk{
width:32px;
height:32px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:12px;
font-weight:700;
font-family:"JetBrains Mono";
border:2px solid white;
box-shadow:0 2px 6px rgba(0,0,0,0.4);
}

.mk.af{background:#c0275a;}
.mk.am{background:#1256a8;}
.mk.sa{background:#107060;}

#table{
height:190px;
overflow:auto;
background:white;
}

table{
width:100%;
border-collapse:collapse;
font-size:12px;
}

th,td{
padding:8px;
border-bottom:1px solid #ddd;
}

th{
background:#f0f0f0;
font-weight:600;
}

.clickable{
color:#107060;
font-weight:600;
cursor:pointer;
}

</style>

</head>

<body>

<div id="header">
🐊 Chambal Gharial – Field Observation Platform
</div>

<div id="map"></div>

<div id="table">

<table id="dataTable">

<thead>
<tr>

<th>Animal ID</th>
<th>Timestamp</th>
<th>Place</th>
<th>Activity</th>
<th>Signal</th>
<th>Category</th>
<th>Latitude</th>
<th>Longitude</th>
<th>Observer</th>

</tr>
</thead>

<tbody></tbody>

</table>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* GOOGLE SHEET CSV */

const sheetURL =
"https://docs.google.com/spreadsheets/d/1-qg3MnjhJn2SCwPYnyCPgI2ujy235X-chN_EHlJDK3g/export?format=csv&gid=0";


/* MAP */

const map = L.map("map").setView([25.85,76.55],11);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{maxZoom:18}
).addTo(map);

const markerLayer = L.layerGroup().addTo(map);


/* GET LATEST FIX PER ANIMAL */

function getLatestFixes(data){

const latest = {};

data.forEach(row => {

const id = row["Animal ID"];
const time = new Date(row["Timestamp"]);

if(!latest[id] || time > new Date(latest[id]["Timestamp"])){

latest[id] = row;

}

});

return Object.values(latest);

}


/* CREATE MARKER */

function createMarker(row){

const lat = parseFloat(row["Latitude"]);
const lon = parseFloat(row["Longitude"]);
const id = row["Animal ID"];
const category = row["Category"];

let cls = "sa";

if(category.includes("Female")) cls="af";
if(category.includes("Male")) cls="am";

const icon = L.divIcon({

className:"mk "+cls,
html:id,
iconSize:[32,32]

});

const marker = L.marker([lat,lon],{icon});

marker.bindPopup(

"<b>"+id+"</b><br>"+
row["Place"]+"<br>"+
row["Activity"]+"<br>"+
row["Timestamp"]

);

markerLayer.addLayer(marker);

}


/* RENDER TABLE */

function renderTable(data){

const tbody = document.querySelector("#dataTable tbody");

tbody.innerHTML = "";

data.forEach(row => {

const tr = document.createElement("tr");

tr.innerHTML = `

<td class="clickable">${row["Animal ID"]}</td>
<td>${row["Timestamp"]}</td>
<td>${row["Place"]}</td>
<td>${row["Activity"]}</td>
<td>${row["Signal"]}</td>
<td>${row["Category"]}</td>
<td>${row["Latitude"]}</td>
<td>${row["Longitude"]}</td>
<td>${row["Observer"]}</td>

`;

tbody.appendChild(tr);

});

}


/* LOAD DATA */

fetch(sheetURL)

.then(r => r.text())

.then(csv => {

const rows = csv.split("\n").map(r => r.split(","));

const headers = rows.shift();

const data = rows.map(r => {

let obj = {};

headers.forEach((h,i)=>obj[h.trim()] = r[i]);

return obj;

});


const latest = getLatestFixes(data);


latest.forEach(createMarker);

renderTable(latest);

});

</script>

</body>
</html>

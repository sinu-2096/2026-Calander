<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pali FT Hatchlings Telemetry Dashboard</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

:root{
--map-height:70vh;
--header-bg:#2c3e50;
--bg:#f4f6f9;
--border:#ccc;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial;
}

body{
background:var(--bg);
display:flex;
flex-direction:column;
min-height:100vh;
}

/* HEADER */

header{
background:var(--header-bg);
color:white;
padding:12px 20px;
display:grid;
grid-template-columns:auto auto 1fr;
align-items:center;
gap:12px;
}

header img{
height:42px;
}

header h1{
text-align:center;
font-size:1.5rem;
}

/* TOP PANEL */

.top-panel{
background:white;
padding:12px 20px;
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
gap:20px;
flex-wrap:wrap;
}

.filter-group{
display:flex;
align-items:center;
gap:8px;
}

select{
padding:6px 10px;
border-radius:4px;
border:1px solid #bbb;
}

button{
padding:7px 12px;
background:#2c3e50;
color:white;
border:none;
border-radius:4px;
cursor:pointer;
}

/* ANALYTICS */

.analytics-panel{
display:none;
background:#fff8dc;
padding:10px 20px;
border-bottom:1px solid #ddd;
}

/* STATUS BAR */

.status-bar{
background:#ecf0f1;
padding:8px 20px;
font-size:0.9rem;
}

/* MAP */

.map-container{
height:var(--map-height);
}

#map{
height:100%;
width:100%;
}

/* TABLE */

.table-hint{
font-size:0.85rem;
padding:8px 20px;
background:white;
}

.table-container{
background:white;
padding:20px;
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
font-size:0.9rem;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:left;
}

th{
background:#2c3e50;
color:white;
position:sticky;
top:0;
}

tbody tr:hover{
background:#dce8f5;
cursor:pointer;
}

/* MARKERS */

.marker{
width:28px;
height:28px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-weight:bold;
border:2px solid white;
box-shadow:0 0 5px rgba(0,0,0,0.6);
}

.blue{
background:#007bff;
}

.red{
background:#e74c3c;
}

.star{
font-size:20px;
color:#ffcc00;
}

/* FIELD PANEL */

.field-panel{
position:fixed;
top:0;
right:-360px;
width:360px;
height:100%;
background:white;
box-shadow:-3px 0 10px rgba(0,0,0,0.2);
padding:20px;
overflow:auto;
transition:right .3s;
z-index:999;
}

.field-panel.open{
right:0;
}

.field-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.close-btn{
cursor:pointer;
font-size:20px;
}

.update-item{
margin-bottom:10px;
padding-bottom:8px;
border-bottom:1px solid #ddd;
}

</style>
</head>

<body>

<header>
<img src="image.png">
<img src="unnamed.png">
<h1>🐊 Pali FT Hatchlings Telemetry Dashboard</h1>
</header>

<div class="top-panel">

<div class="filter-group">
<label>Select Animal</label>
<select id="animalFilter">
<option value="all">All Animals</option>
</select>
</div>

<button onclick="toggleFieldPanel()">Field Updates</button>

</div>

<div class="analytics-panel" id="analyticsPanel"></div>

<div class="status-bar" id="statusBar">
Loading telemetry...
</div>

<div class="map-container">
<div id="map"></div>
</div>

<p class="table-hint">💡 Click any row to jump to map location</p>

<div class="table-container">
<table id="dataTable">

<thead>
<tr>
<th>Animal ID</th>
<th>Timestamp</th>
<th>Place</th>
<th>Activity</th>
<th>Signal</th>
<th>Latitude</th>
<th>Longitude</th>
<th>Remarks</th>
</tr>
</thead>

<tbody></tbody>

</table>
</div>

<div class="field-panel" id="fieldPanel">

<div class="field-header">
<h3>Field Updates</h3>
<span class="close-btn" onclick="toggleFieldPanel()">✖</span>
</div>

<div id="updatesContainer"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/OverlappingMarkerSpiderfier-Leaflet/0.2.6/oms.min.js"></script>

<script>

const CSV_URL='https://docs.google.com/spreadsheets/d/10maxgDHDOISlVaN3kuc0_BjxOwPVysci5AiFL-WAxoQ/export?format=csv&gid=0';
const UPDATE_URL='https://docs.google.com/spreadsheets/d/10maxgDHDOISlVaN3kuc0_BjxOwPVysci5AiFL-WAxoQ/export?format=csv&gid=238985281';

const DEAD_IDS=["30","33","34","38","96","64","98"];

const MAP_CENTER=[25.84,76.56];
const MAP_ZOOM=13;

let map;
let oms;

let rawData=[];
let animalsData={};
let latestRecords={};

let markers=[];
let markerMapping={};

function init(){

initMap();
loadTelemetry();
loadUpdates();

document.getElementById("animalFilter")
.addEventListener("change",e=>{
updateDashboard(e.target.value);
});

}

function initMap(){

map=L.map("map").setView(MAP_CENTER,MAP_ZOOM);

L.tileLayer(
"http://mt0.google.com/vt/lyrs=y&x={x}&y={y}&z={z}",
{maxZoom:20}
).addTo(map);

oms=new OverlappingMarkerSpiderfier(map,{keepSpiderfied:true});

}

function loadTelemetry(){

Papa.parse(CSV_URL,{
download:true,
header:true,
skipEmptyLines:true,

complete:function(results){

rawData=results.data;

processData();
populateDropdown();

updateDashboard("all");
updateStatus();

}

});

}

function processData(){

animalsData={};
latestRecords={};

rawData.forEach(r=>{

let id=r["Animal ID"];
if(!id) return;

r.parsedDate=parseDate(r.Timestamp);

if(!animalsData[id]) animalsData[id]=[];

animalsData[id].push(r);

});

for(let id in animalsData){

animalsData[id].sort((a,b)=>b.parsedDate-a.parsedDate);

latestRecords[id]=animalsData[id][0];

}

}

function populateDropdown(){

let sel=document.getElementById("animalFilter");

Object.keys(animalsData).sort((a,b)=>a-b)
.forEach(id=>{

let o=document.createElement("option");
o.value=id;
o.textContent=id;

sel.appendChild(o);

});

}

function parseDate(s){

if(!s) return new Date(0);

let p=s.split(" ");

let d=p[0].split("-");
let t=p[1].split(":");

return new Date(d[2],d[1]-1,d[0],t[0],t[1]);

}

function formatDate(d){

return d.toLocaleDateString("en-GB",{
day:"numeric",
month:"long",
year:"numeric"
})+" "+
d.toLocaleTimeString("en-GB",{
hour:"2-digit",
minute:"2-digit"
});

}

function clearMap(){

markers.forEach(m=>map.removeLayer(m));
markers=[];

}

function updateDashboard(id){

clearMap();

renderMap(id);
renderTable(id);

}

function renderMap(selected){

if(selected==="all"){

for(let id in latestRecords){

addMarker(latestRecords[id]);

}

document.getElementById("analyticsPanel").style.display="none";

}

else{

let rec=animalsData[selected];

let latlngs=[];

for(let i=rec.length-1;i>=0;i--){

let r=rec[i];

addMarker(r);

latlngs.push([r.Latitude,r.Longitude]);

}

if(latlngs.length>1){

L.polyline(latlngs,{
color:"#ffc107",
weight:3,
dashArray:"6,10"
}).addTo(map);

}

addRelease(rec[rec.length-1]);

computeAnalytics(selected);

}

}

function addMarker(r){

let lat=parseFloat(r.Latitude);
let lng=parseFloat(r.Longitude);

if(isNaN(lat)||isNaN(lng)) return;

let id=r["Animal ID"];

let color=DEAD_IDS.includes(id)?"red":"blue";

let icon=L.divIcon({
className:"",
html:`<div class="marker ${color}">${id}</div>`,
iconSize:[28,28]
});

let m=L.marker([lat,lng],{icon}).addTo(map);

m.bindPopup(`
<b>Animal ID:</b> ${r["Animal ID"]}<br>
<b>Timestamp:</b> ${r["Timestamp"]}<br>
<b>Latitude:</b> ${r["Latitude"]}<br>
<b>Longitude:</b> ${r["Longitude"]}<br>
<b>Place:</b> ${r["Place"]}<br>
<b>Activity:</b> ${r["Activity"]}<br>
<b>Signal:</b> ${r["Signal Strength"]}<br>
<b>Remarks:</b> ${r["Remarks"]||""}
`);

markers.push(m);
oms.addMarker(m);

markerMapping[id+"_"+r.Timestamp]=m;

}

function addRelease(r){

let icon=L.divIcon({
html:`<div class="star">⭐</div>`,
iconSize:[20,20]
});

L.marker([r.Latitude,r.Longitude],{icon})
.addTo(map)
.bindPopup("Release Point");

}

function haversine(a,b){

let R=6371000;

let lat1=a[0]*Math.PI/180;
let lat2=b[0]*Math.PI/180;

let dlat=(b[0]-a[0])*Math.PI/180;
let dlon=(b[1]-a[1])*Math.PI/180;

let x=Math.sin(dlat/2)**2+
Math.cos(lat1)*Math.cos(lat2)*Math.sin(dlon/2)**2;

let c=2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));

return R*c;

}

function computeAnalytics(id){

let rec=animalsData[id];

if(rec.length<2) return;

let release=[rec[rec.length-1].Latitude,rec[rec.length-1].Longitude];
let latest=[rec[0].Latitude,rec[0].Longitude];

let max=0;

rec.forEach(r=>{
let d=haversine(release,[r.Latitude,r.Longitude]);
if(d>max) max=d;
});

let current=haversine(release,latest);

let prev=haversine(
[rec[1].Latitude,rec[1].Longitude],
latest
);

let type="Settler";

if(max>1500) type="Disperser";
else{

let recent=rec.slice(0,10);

let maxRecent=0;

recent.forEach(r=>{
let d=haversine(release,[r.Latitude,r.Longitude]);
if(d>maxRecent) maxRecent=d;
});

if(maxRecent>300) type="Explorer";

}

let panel=document.getElementById("analyticsPanel");

panel.style.display="block";

panel.innerHTML=`
<b>Movement Analytics — ID ${id}</b><br>
Maximum displacement from release: ${Math.round(max)} m<br>
Current distance from release: ${Math.round(current)} m<br>
Distance from previous fix: ${Math.round(prev)} m<br>
Movement type: ${type}
`;

}

function updateStatus(){

let latest=null;

rawData.forEach(r=>{
let d=parseDate(r.Timestamp);
if(!latest||d>latest) latest=d;
});

document.getElementById("statusBar")
.innerText="Latest Telemetry: "+formatDate(latest);

}

function renderTable(selected){

let tbody=document.querySelector("#dataTable tbody");

tbody.innerHTML="";

let data=[];

if(selected==="all")
data=Object.values(latestRecords);
else
data=animalsData[selected];

data.sort((a,b)=>b.parsedDate-a.parsedDate);

data.forEach(r=>{

let tr=document.createElement("tr");

tr.innerHTML=`
<td>${r["Animal ID"]}</td>
<td>${r["Timestamp"]}</td>
<td>${r["Place"]}</td>
<td>${r["Activity"]}</td>
<td>${r["Signal Strength"]}</td>
<td>${r["Latitude"]}</td>
<td>${r["Longitude"]}</td>
<td>${r["Remarks"]||""}</td>
`;

tr.onclick=function(){

let key=r["Animal ID"]+"_"+r.Timestamp;

let m=markerMapping[key];

if(m){

map.setView(m.getLatLng(),16);
m.openPopup();

}

};

tbody.appendChild(tr);

});

}

function loadUpdates(){

Papa.parse(UPDATE_URL,{
download:true,
header:true,
skipEmptyLines:true,

complete:function(results){

let rows=results.data;

let container=document.getElementById("updatesContainer");

rows.sort((a,b)=>parseDate(b.Date)-parseDate(a.Date));

rows.forEach(r=>{

if(!r.Date||!r.Update) return;

let d=parseDate(r.Date);

let div=document.createElement("div");

div.className="update-item";

div.innerHTML=`<b>${d.toLocaleDateString("en-GB")}</b><br>${r.Update}`;

container.appendChild(div);

});

}

});

}

function toggleFieldPanel(){

document.getElementById("fieldPanel").classList.toggle("open");

}

document.addEventListener("DOMContentLoaded",init);

</script>

</body>
</html>
